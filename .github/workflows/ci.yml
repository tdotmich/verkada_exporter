name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run CI by hand from the Actions tab.
  workflow_dispatch:
  schedule:
    # Weekly, so new Go vulnerabilities are found also when the code does not change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Docker build
        run: docker build --tag verkada_exporter:ci .
