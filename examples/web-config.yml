# Use with: verkada_exporter -web.config.file=web-config.yml
# Full reference: https://github.com/prometheus/exporter-toolkit/blob/master/docs/web-configuration.md
tls_server_config:
  cert_file: /etc/verkada_exporter/tls.crt
  key_file: /etc/verkada_exporter/tls.key

# Basic auth. The value is a bcrypt hash, not the password.
# Make a hash with: htpasswd -nBC 10 "" | tr -d ':\n'
basic_auth_users:
  prometheus: $2y$10$REPLACE_WITH_A_BCRYPT_HASH
