groups:
  - name: verkada_exporter
    rules:
      - alert: VerkadaExporterDown
        expr: up{job="verkada"} == 0
        for: 5m
        annotations:
          summary: Prometheus cannot scrape the Verkada exporter.

      - alert: VerkadaAPIFailing
        expr: verkada_up == 0
        for: 5m
        annotations:
          summary: The exporter cannot get data from the Verkada API.

      - alert: VerkadaCameraOffline
        expr: verkada_camera_online == 0
        for: 10m
        annotations:
          summary: "Camera {{ $labels.name }} at {{ $labels.site }} is offline."

      - alert: VerkadaCameraFirmwareNotUpToDate
        expr: verkada_camera_info{firmware!="Up to date"} == 1
        for: 7d
        annotations:
          summary: "Camera {{ $labels.name }} firmware status is {{ $labels.firmware }}."
